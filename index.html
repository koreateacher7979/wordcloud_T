<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강사용 워드클라우드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- D3.js & D3 Cloud for Word Cloud -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.7/d3.layout.cloud.min.js"></script>
    <!-- html2canvas for Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            overflow: hidden; /* 스크롤 완전 방지 */
        }
        #wordcloud-container {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        svg text { cursor: pointer; transition: opacity 0.3s, transform 0.2s; }
        svg text:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">

    <header class="bg-indigo-700 text-white shadow-md z-20 flex-shrink-0">
        <div class="px-6 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold" id="header-title">강사용 시스템 로딩중...</h1>
            <div class="text-xs text-indigo-200 whitespace-nowrap ml-4">
                개발자 : 가치있는 미래교육 연구소 대표 김병찬
            </div>
        </div>
    </header>

    <main class="flex-1 relative bg-[#f8fafc] flex flex-col" id="capture-area">
        
        <!-- 상단 정보 패널 -->
        <div class="px-6 py-4 bg-white/80 backdrop-blur-md shadow-sm z-10 flex justify-between items-center border-b absolute top-0 left-0 right-0">
            <div>
                <div id="inst-title" class="text-xl font-black text-gray-800"></div>
                <div id="inst-question" class="text-sm font-bold text-indigo-600 mt-1"></div>
            </div>
            <div class="text-sm text-gray-600 font-bold bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100 shadow-sm">
                수집된 단어: <span id="data-count" class="text-indigo-600 font-black text-lg">0</span> 건
            </div>
        </div>

        <!-- 워드클라우드 컨테이너 -->
        <div class="flex-1 w-full h-full pt-20 pb-16 relative">
            <div id="wordcloud-container"></div>
            <!-- 초기 상태 표시 -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 pointer-events-none">
                <svg class="w-16 h-16 mb-4 text-gray-300 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <p class="font-medium text-lg">참여자들의 의견을 기다리고 있습니다...</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white p-3 flex justify-between items-center z-20 flex-shrink-0 shadow-[0_-5px_15px_rgba(0,0,0,0.1)]">
        <div class="flex items-center space-x-2 text-sm text-gray-400">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            <span>2초 주기 실시간 동기화 중</span>
        </div>
        <div class="flex space-x-3">
            <button onclick="promptEditQuestion()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition flex items-center shadow-md">
                질문 수정
            </button>
            <button onclick="downloadImage()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition flex items-center shadow-md">
                이미지 저장
            </button>
            <button onclick="promptResetData()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded-lg text-sm font-medium transition flex items-center shadow-md">
                데이터 초기화
            </button>
        </div>
    </footer>

    <!-- 커스텀 디자인 모달 (alert/prompt 대체) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm transform transition-all text-center sm:text-left">
            <h3 id="modal-title" class="text-xl font-bold mb-2 text-gray-800"></h3>
            <p id="modal-msg" class="text-gray-600 mb-4 text-sm break-keep"></p>
            
            <div id="modal-inputs" class="space-y-3 mb-6 hidden">
                <input type="password" id="modal-input-pw" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none hidden" placeholder="관리자 비밀번호 (A2셀)">
                <input type="text" id="modal-input-text" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none hidden" placeholder="새로운 질문">
            </div>

            <div id="modal-buttons" class="flex space-x-2 justify-end">
                <button id="btn-cancel" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 hidden">취소</button>
                <button id="btn-confirm" class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">확인</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 중요: 여기에 GAS 웹앱 배포 URL을 붙여넣으세요!
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwvbKJ7HHWnzLMWE48SB-hSpsz7QT6l7FybrvoMcfCvAkqnq4II5rB5bB_DCKRfDSE/exec"; 

        let globalConfig = null;
        let lastWordCount = -1; // 이전 데이터 수 기억하여 변경시에만 렌더링
        let syncInterval;

        // 알록달록 색상 팔레트
        const colorPalette = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93", "#f15bb5", "#00bbf9", "#00f5d4", "#fb5607", "#ff006e"];

        // 커스텀 모달 제어 함수
        function showModal({ title, msg, type = 'alert', onConfirm }) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerHTML = msg;
            
            const mInputs = document.getElementById('modal-inputs');
            const mInputPw = document.getElementById('modal-input-pw');
            const mInputText = document.getElementById('modal-input-text');
            const btnCancel = document.getElementById('btn-cancel');
            const btnConfirm = document.getElementById('btn-confirm');
            
            mInputs.classList.add('hidden');
            mInputPw.classList.add('hidden');
            mInputText.classList.add('hidden');
            btnCancel.classList.add('hidden');
            
            mInputPw.value = '';
            
            if (type === 'prompt-pw') {
                mInputs.classList.remove('hidden');
                mInputPw.classList.remove('hidden');
                btnCancel.classList.remove('hidden');
                setTimeout(() => mInputPw.focus(), 100);
            } else if (type === 'prompt-question') {
                mInputs.classList.remove('hidden');
                mInputPw.classList.remove('hidden');
                mInputText.classList.remove('hidden');
                btnCancel.classList.remove('hidden');
                setTimeout(() => mInputPw.focus(), 100);
            } else if (type === 'confirm') {
                btnCancel.classList.remove('hidden');
            }

            modal.style.display = 'flex';

            btnCancel.onclick = () => { modal.style.display = 'none'; };
            btnConfirm.onclick = () => {
                modal.style.display = 'none';
                if(onConfirm) {
                    if(type === 'prompt-pw') onConfirm(mInputPw.value);
                    else if(type === 'prompt-question') onConfirm(mInputPw.value, mInputText.value);
                    else onConfirm();
                }
            };
        }

        // API 호출 공통 래퍼 함수
        async function callGasApi(action, payload = {}) {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: action, payload: payload })
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.message);
            return result.data;
        }

        // 초기 설정 로드
        async function init() {
            try {
                globalConfig = await callGasApi('getConfig');
                updateUIConfig(globalConfig);
                
                // 최초 1회 즉시 데이터 로드
                await fetchAndRenderWords();
                
                // 1초마다 스마트 실시간 동기화 (재귀 방식으로 멈춤 방지)
                startSync();
                
            } catch (error) {
                showModal({ title: "연결 오류", msg: "서버 연결 실패: " + error.message });
            }
        }

        function updateUIConfig(config) {
            document.getElementById('header-title').innerText = config.title;
            document.getElementById('inst-title').innerText = config.title;
            document.getElementById('inst-question').innerText = config.question;
        }

        let isFetching = false;
        function startSync() {
            setTimeout(async () => {
                if (!isFetching) await fetchAndRenderWords();
                startSync();
            }, 1000); // 1초 대기 후 초고속 요청
        }

        // 데이터 가져오기 및 렌더링 제어
        async function fetchAndRenderWords() {
            isFetching = true;
            try {
                const wordsArray = await callGasApi('getWordsData');
                
                document.getElementById('data-count').innerText = wordsArray.length;
                
                if (wordsArray.length === 0) {
                    document.getElementById('empty-state').style.display = 'flex';
                    document.getElementById('wordcloud-container').innerHTML = '';
                    lastWordCount = 0;
                    return;
                }
                
                document.getElementById('empty-state').style.display = 'none';

                // 데이터 개수가 이전과 다르거나, 화면 크기가 변경되었을 때만 재렌더링
                if (wordsArray.length !== lastWordCount) {
                    lastWordCount = wordsArray.length;
                    renderWordCloud(wordsArray);
                }
            } catch (error) {
                console.error("데이터 동기화 에러:", error);
            } finally {
                isFetching = false;
            }
        }

        // d3 기반 워드클라우드 렌더링 로직
        function renderWordCloud(wordsArray) {
            // 단어 빈도수 계산
            const counts = {};
            wordsArray.forEach(w => { counts[w] = (counts[w] || 0) + 1; });
            const keys = Object.keys(counts);

            const maxCount = Math.max(...Object.values(counts));
            const minCount = Math.min(...Object.values(counts));
            
            const container = document.getElementById('wordcloud-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // 화면 비율에 따른 기본 폰트 사이즈
            const baseFontSize = width < 800 ? 18 : 28;
            const sizeMultiplier = width < 800 ? 15 : 30;

            const mappedWords = keys.map(word => {
                let scale = 1;
                if(maxCount > minCount) {
                    scale = 1 + ((counts[word] - minCount) / (maxCount - minCount));
                }
                return {
                    text: word,
                    size: baseFontSize + (scale * sizeMultiplier), 
                    count: counts[word]
                };
            });

            container.innerHTML = ''; // 초기화

            const layout = d3.layout.cloud()
                .size([width, height])
                .words(mappedWords)
                .padding(8)
                .rotate(() => (~~(Math.random() * 6) - 3) * 15) // -45도 ~ 45도 사이 약간의 기울기
                .font("'Noto Sans KR', sans-serif")
                .fontWeight(d => d.count > (maxCount/2) ? "900" : "700")
                .fontSize(d => d.size)
                .on("end", draw);

            layout.start();

            function draw(words) {
                const svg = d3.select("#wordcloud-container").append("svg")
                    .attr("width", layout.size()[0])
                    .attr("height", layout.size()[1])
                    .append("g")
                    .attr("transform", "translate(" + layout.size()[0] / 2 + "," + layout.size()[1] / 2 + ")");

                svg.selectAll("text")
                    .data(words)
                    .enter().append("text")
                    .style("font-size", d => d.size + "px")
                    .style("font-family", "'Noto Sans KR', sans-serif")
                    .style("font-weight", d => d.count > (maxCount/2) ? "900" : "700")
                    .style("fill", () => colorPalette[Math.floor(Math.random() * colorPalette.length)])
                    .attr("text-anchor", "middle")
                    .attr("transform", d => "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")")
                    .text(d => d.text)
                    .append("title")
                    .text(d => `${d.text} (${d.count}명)`);
            }
        }

        // 창 크기 변경 시 재렌더링
        window.addEventListener('resize', () => {
            if(lastWordCount > 0) {
                lastWordCount = -1; // 강제 리렌더링 유발
                fetchAndRenderWords();
            }
        });

        // 관리자 동작: 질문 변경
        async function promptEditQuestion() {
            if (!globalConfig) {
                showModal({ title: "알림", msg: "서버 설정을 불러오는 중입니다. 잠시 후 다시 시도해주세요." });
                return;
            }
            
            document.getElementById('modal-input-text').value = globalConfig.question;

            showModal({
                title: "질문 수정",
                msg: "관리자 비밀번호와 새로운 질문을 입력하세요.",
                type: 'prompt-question',
                onConfirm: async (pw, newQ) => {
                    if (!pw || !newQ) return;
                    
                    // Optimistic UI: 화면에 질문을 먼저 0초 만에 변경해버림
                    document.getElementById('inst-question').innerText = newQ;

                    try {
                        await callGasApi('updateQuestion', { pw: pw.trim(), newQuestion: newQ });
                        showModal({ title: "성공", msg: "질문이 성공적으로 변경되었습니다." });
                        globalConfig = await callGasApi('getConfig');
                        updateUIConfig(globalConfig);
                    } catch (error) {
                        document.getElementById('inst-question').innerText = globalConfig.question; // 실패시 원상복구
                        showModal({ title: "오류", msg: "비밀번호가 일치하지 않습니다." });
                    }
                }
            });
        }

        // 관리자 동작: 데이터 초기화
        async function promptResetData() {
            if (!globalConfig) {
                showModal({ title: "알림", msg: "서버 설정을 불러오는 중입니다. 잠시 후 다시 시도해주세요." });
                return;
            }

            showModal({
                title: "데이터 초기화",
                msg: "정말 모든 데이터를 삭제하시겠습니까?<br>구글 시트에서도 완전히 삭제됩니다.<br><br><b>관리자 비밀번호</b>를 입력하세요.",
                type: 'prompt-pw',
                onConfirm: async (pw) => {
                    if (!pw) return;

                    try {
                        await callGasApi('resetData', { pw: pw.trim() });
                        
                        // 통신 성공 즉시 화면 리셋 (서버 대기 최소화)
                        showModal({ title: "초기화 성공", msg: "데이터가 완전히 초기화되었습니다." });
                        lastWordCount = 0;
                        document.getElementById('wordcloud-container').innerHTML = ''; 
                        document.getElementById('data-count').innerText = "0";
                        document.getElementById('empty-state').style.display = 'flex';
                        
                    } catch (error) {
                        showModal({ title: "오류", msg: "비밀번호가 일치하지 않습니다." });
                    }
                }
            });
        }

        // 이미지 저장
        async function downloadImage() {
            const captureArea = document.getElementById('capture-area');
            const originalTitle = document.title;
            
            try {
                // UI 캡쳐 정리
                const emptyState = document.getElementById('empty-state');
                const wasEmptyVisible = emptyState.style.display !== 'none';
                emptyState.style.display = 'none';

                const canvas = await html2canvas(captureArea, {
                    backgroundColor: "#f8fafc",
                    scale: 2
                });

                if(wasEmptyVisible) emptyState.style.display = 'flex';

                const link = document.createElement('a');
                link.download = `워드클라우드_${globalConfig ? globalConfig.title : '저장'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                showModal({ title: "오류", msg: "이미지 캡쳐에 실패했습니다." });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
