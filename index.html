<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강사용 워드클라우드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#111827',
                        darkPanel: '#1F2937'
                    }
                }
            }
        }
    </script>
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        ::-webkit-scrollbar { display: none; } /* 스크롤바 숨기기 */
    </style>
</head>
<body class="w-full h-screen overflow-hidden bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 flex flex-col transition-colors duration-300">

<!-- Header -->
<header class="w-full bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 py-2 px-6 flex justify-between items-center z-10 shrink-0 shadow-sm dark:shadow-none transition-colors duration-300">
    <div class="flex items-center gap-2">
        <i class="ph-fill ph-chalkboard-teacher text-blue-600 dark:text-blue-400 text-xl"></i>
        <p class="text-sm font-semibold tracking-wide">개발자 : 가치있는 미래교육 연구소 대표 김병찬</p>
    </div>
    <div class="flex gap-2">
        <button onclick="toggleTheme()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 transition">
            <i id="theme-icon" class="ph-fill ph-moon"></i> <span class="hidden sm:inline" id="theme-text">테마</span>
        </button>
        <button onclick="saveImage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 shadow-sm transition">
            <i class="ph ph-camera"></i> <span class="hidden sm:inline">이미지 저장</span>
        </button>
        <button onclick="openAdminModal()" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 shadow-sm transition">
            <i class="ph ph-gear"></i> <span class="hidden sm:inline">설정</span>
        </button>
    </div>
</header>

<!-- Main Workspace (전체 캡처 영역) -->
<main id="main-workspace" class="flex-1 flex flex-col w-full relative h-full overflow-hidden bg-gray-50 dark:bg-darkBg transition-colors duration-300 p-4">
    <!-- Top Info Bar -->
    <div class="w-full p-2 md:p-4 z-10 shrink-0 text-center flex flex-col items-center justify-center">
        <div class="mb-2">
            <span id="target-badge" class="inline-block bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-300 text-xs md:text-sm px-3 py-1 rounded-full font-bold shadow-sm border border-blue-200 dark:border-blue-800">대상 불러오는 중...</span>
        </div>
        <h1 id="title-text" class="text-xl md:text-2xl font-extrabold mb-3 drop-shadow-sm text-gray-800 dark:text-gray-100">연수 제목 불러오는 중...</h1>
        <p id="question-text" class="text-lg md:text-xl font-bold text-gray-700 dark:text-gray-300 px-4 py-1">질문 불러오는 중...</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2 font-medium">총 참여 단어 수: <span id="word-count" class="font-bold text-blue-600 dark:text-blue-400">0</span>개</p>
    </div>

    <!-- WordCloud Canvas Container -->
    <div class="flex-1 w-full relative flex items-center justify-center">
        <!-- Canvas wrapper -->
        <div id="canvas-container" class="w-full h-full flex items-center justify-center max-w-6xl mx-auto">
            <canvas id="wordcloud-canvas" class="w-full h-full"></canvas>
        </div>
    </div>
</main>

<!-- Admin Modal Overlay -->
<div id="admin-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center transition-opacity">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden transform scale-100 transition-transform">
        <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2">
                <i class="ph-fill ph-shield-check text-blue-500"></i> 관리자 모드
            </h2>
            <button onclick="closeAdminModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        <div class="p-5 space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">인증번호 (시트 A2셀)</label>
                <input type="password" id="admin-pw" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none dark:text-white" placeholder="인증번호 입력">
            </div>
            
            <div class="border-t border-gray-200 dark:border-gray-700 pt-3 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">대상 (시트 C2셀)</label>
                    <input type="text" id="admin-target" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">연수 제목 (시트 B2셀)</label>
                    <input type="text" id="admin-title" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">질문 내용 (시트 E2셀)</label>
                    <textarea id="admin-question" rows="2" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none dark:text-white"></textarea>
                </div>
                <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow-md text-sm">
                    설정 저장하기
                </button>
            </div>

            <div class="border-t border-gray-200 dark:border-gray-700 pt-3">
                <p class="text-xs text-red-500 font-bold mb-1">데이터 초기화 (주의)</p>
                <p class="text-[11px] text-gray-500 dark:text-gray-400 mb-2">수집된 모든 단어 데이터를 일괄 삭제하며, 시트 데이터도 함께 삭제됩니다.</p>
                <button onclick="resetData()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg flex items-center justify-center gap-1 transition shadow-md text-sm">
                    <i class="ph ph-trash"></i> 모든 데이터 초기화
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==============================================================================
    // [중요] 아래 GAS_URL 변수에 복사한 Apps Script '웹 앱 URL'을 반드시 붙여넣으세요!
    // ==============================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx0G23gNrwNmS8knwhixqmbmRAt6ovdw63w1NAVbWd7JPZ_XS3HYWJcBygZiYecfKQ/exec"; 
    
    let currentWords = {};
    let isDrawing = false;
    let syncInterval;

    // 테마 토글
    function toggleTheme() {
        const html = document.documentElement;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            icon.className = 'ph-fill ph-sun text-orange-500';
            text.innerText = '라이트모드';
        } else {
            html.classList.add('dark');
            icon.className = 'ph-fill ph-moon text-yellow-400';
            text.innerText = '다크모드';
        }
        if(Object.keys(currentWords).length > 0) renderWordCloud(currentWords);
    }

    // 캔버스 크기 조정
    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('wordcloud-canvas');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        if(Object.keys(currentWords).length > 0) {
            renderWordCloud(currentWords);
        }
    }

    window.addEventListener('resize', () => {
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(resizeCanvas, 200);
    });

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('theme-icon').className = 'ph-fill ph-moon text-yellow-400';
        document.getElementById('theme-text').innerText = '다크모드';
        
        resizeCanvas();

        // 에러 방지 안전장치: URL 입력 안 한 경우 작동 중지
        if (GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE" || !GAS_URL.startsWith("http")) {
            Swal.fire({
                icon: 'info',
                title: '연결 대기 중',
                text: 'HTML 코드 내의 GAS_URL 변수에 실제 구글 앱스 스크립트 웹 앱 URL을 입력하시면 실제 데이터와 연동됩니다.',
                confirmButtonText: '확인'
            });
            document.getElementById('title-text').innerText = "URL을 설정해주세요";
            document.getElementById('question-text').innerText = "코드 내의 GAS_URL을 변경해야 합니다.";
            document.getElementById('target-badge').innerText = "대기중";
            return; // Return early! Do NOT start the interval or fetch data.
        }

        fetchData();
        // 빠른 반응을 위해 1초 간격으로 동기화
        syncInterval = setInterval(fetchData, 1000); 
    });

    async function fetchData() {
        try {
            const response = await fetch(`${GAS_URL}?action=getState`);
            const data = await response.json();
            if(data.error) throw new Error(data.error);

            // 상단 정보 업데이트
            document.getElementById('title-text').innerText = data.title;
            document.getElementById('target-badge').innerText = data.target;
            document.getElementById('question-text').innerText = data.question;
            
            // 모달창이 닫혀있을 때만 폼 데이터 동기화 (입력 중 덮어쓰기 방지)
            const adminModal = document.getElementById('admin-modal');
            if (adminModal.classList.contains('hidden')) {
                document.getElementById('admin-title').value = data.title;
                document.getElementById('admin-target').value = data.target;
                document.getElementById('admin-question').value = data.question;
            }

            // 단어 데이터 변환
            const wordsArray = Object.keys(data.words).map(key => [key, data.words[key]]);
            const totalWords = Object.values(data.words).reduce((sum, val) => sum + val, 0);
            document.getElementById('word-count').innerText = totalWords;

            if (JSON.stringify(currentWords) !== JSON.stringify(data.words)) {
                currentWords = data.words;
                renderWordCloud(currentWords);
            }
        } catch (error) {
            console.error('동기화 에러:', error);
        }
    }

    function renderWordCloud(wordsObj) {
        if (isDrawing) return; 
        
        const canvas = document.getElementById('wordcloud-canvas');
        const wordsArray = Object.keys(wordsObj).map(key => [key, wordsObj[key]]);
        
        if(wordsArray.length === 0) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        isDrawing = true;
        
        const maxFreq = Math.max(...wordsArray.map(w => w[1]));
        const minFreq = Math.min(...wordsArray.map(w => w[1]));
        
        const baseSize = Math.min(canvas.width, canvas.height) / 18;

        const normalizedWords = wordsArray.map(w => {
            let weight = 1;
            if (maxFreq > minFreq) {
                weight = 1 + (w[1] - minFreq) / (maxFreq - minFreq) * 3; // 1~4 배율
            }
            return [w[0], baseSize * weight]; 
        });

        const isDark = document.documentElement.classList.contains('dark');
        const bgClearColor = isDark ? '#111827' : '#f9fafb';

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = bgClearColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const colors = [
            '#F87171', '#FBBF24', '#34D399', '#60A5FA', '#A78BFA', '#F472B6', 
            '#38BDF8', '#4ADE80', '#FB923C', '#E879F9', '#2DD4BF', '#FB7185'
        ];

        WordCloud(canvas, {
            list: normalizedWords,
            fontFamily: 'Noto Sans KR, sans-serif',
            fontWeight: '900',
            color: function () {
                return colors[Math.floor(Math.random() * colors.length)];
            },
            backgroundColor: 'transparent', 
            gridSize: Math.round(16 * canvas.width / 1024),
            rotateRatio: 0.3,
            rotationSteps: 2,
            shape: 'circle',
            drawOutOfBound: false,
            shrinkToFit: true
        });

        canvas.addEventListener('wordcloudstop', function() {
            isDrawing = false;
        }, { once: true });
    }

    async function saveImage() {
        const isDark = document.documentElement.classList.contains('dark');
        const bgColors = { background: isDark ? '#1F2937' : '#fff', color: isDark ? '#fff' : '#111827' };
        
        Swal.fire({
            title: '이미지 생성 중...',
            text: '질문과 워드클라우드를 캡처하고 있습니다.',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); },
            ...bgColors
        });

        try {
            // main-workspace 전체를 캡처 영역으로 지정
            const element = document.getElementById('main-workspace');
            
            // html2canvas 라이브러리로 화면 캡처
            const canvas = await html2canvas(element, {
                backgroundColor: isDark ? '#111827' : '#f9fafb', // 다크/라이트 모드 배경색 반영
                scale: 2, // 고해상도 출력
                logging: false
            });

            const link = document.createElement('a');
            link.download = `워드클라우드_결과_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            
            Swal.fire({
                icon: 'success',
                title: '저장 완료',
                text: '연수 제목과 질문이 포함된 워드클라우드가 저장되었습니다.',
                timer: 2000,
                showConfirmButton: false,
                ...bgColors
            });
        } catch (error) {
            console.error('이미지 저장 에러:', error);
            Swal.fire({ icon: 'error', title: '저장 실패', text: '이미지 저장 중 문제가 발생했습니다.', ...bgColors });
        }
    }

    function openAdminModal() {
        document.getElementById('admin-modal').classList.remove('hidden');
        document.getElementById('admin-pw').value = '';
    }

    function closeAdminModal() {
        document.getElementById('admin-modal').classList.add('hidden');
    }

    async function saveSettings() {
        const password = document.getElementById('admin-pw').value;
        const target = document.getElementById('admin-target').value;
        const title = document.getElementById('admin-title').value;
        const question = document.getElementById('admin-question').value;

        if(!password) {
            Swal.fire('오류', '인증번호를 입력해주세요.', 'warning');
            return;
        }

        const isDark = document.documentElement.classList.contains('dark');
        const bgColors = { background: isDark ? '#1F2937' : '#fff', color: isDark ? '#fff' : '#111827' };

        Swal.fire({
            title: '저장 중...',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); },
            ...bgColors
        });

        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateSettings', password, target, title, question })
            });
            const result = await response.json();
            
            if (result.success) {
                Swal.fire({ icon: 'success', title: '설정 저장 완료', text: '시트에 반영되었습니다.', ...bgColors });
                closeAdminModal();
                fetchData(); 
            } else {
                Swal.fire({ icon: 'error', title: '실패', text: result.error, ...bgColors });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: '네트워크 오류', text: '요청에 실패했습니다.', ...bgColors });
        }
    }

    async function resetData() {
        const password = document.getElementById('admin-pw').value;
        if(!password) {
            Swal.fire('오류', '인증번호를 입력해주세요.', 'warning');
            return;
        }

        const isDark = document.documentElement.classList.contains('dark');
        const bgColors = { background: isDark ? '#1F2937' : '#fff', color: isDark ? '#fff' : '#111827' };

        Swal.fire({
            title: '데이터 초기화',
            text: "정말 모든 단어 데이터를 삭제하시겠습니까?",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: '네, 삭제합니다',
            cancelButtonText: '취소',
            ...bgColors
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: '삭제 중...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }, ...bgColors });
                
                try {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'resetData', password: password })
                    });
                    const resData = await response.json();
                    
                    if (resData.success) {
                        currentWords = {};
                        renderWordCloud({});
                        Swal.fire({ icon: 'success', title: '초기화 완료', text: '모든 데이터가 삭제되었습니다.', ...bgColors });
                        closeAdminModal();
                        fetchData();
                    } else {
                        Swal.fire({ icon: 'error', title: '초기화 실패', text: resData.error, ...bgColors });
                    }
                } catch (error) {
                    Swal.fire({ icon: 'error', title: '네트워크 오류', text: '요청에 실패했습니다.', ...bgColors });
                }
            }
        });
    }
</script>
</body>
</html>
